<!DOCTYPE HTML>
<html lang="en">

	<head><title>Ben's GB emulator</title></head>
	<body>
		<h1>Ben's GB emulator</h1>

		<button id="run-wasm-test" data-testid="run-wasm-test">Run wasm test</button>
		<p id="wasm-console" data-testid="wasm-console"></p>
		<script type="module">
			import init, { say_hello } from './wasm/squaregb.js';
			
			async function run() {
				await init();
				
				document.getElementById("run-wasm-test").addEventListener("click",(e) => {
					document.getElementById("wasm-console").innerText = say_hello();
					});
				}
				run();
		</script>
	</body>
</html>
