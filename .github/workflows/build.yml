name: Build WASM
on: 
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rust:1.95.0
      options: --user 1001
    steps:
      - name: Setup rust
        run: rustup target add wasm32-unknown-unknown && cargo install -f wasm-bindgen-cli --version 0.2.118
      - uses: actions/checkout@v6
      - name: Build crate
        working-directory: ./squaregb
        run: ./build.sh
      - name: Upload Dist folder
        uses: actions/upload-artifact@v7
        with:
          name: 'wasm_dist'
          path: './squaregb/dist'
