<!DOCTYPE HTML>
<html lang="en">

	<head><title>Ben's GB emulator</title>
	<link href="/main.css" rel="stylesheet"></head>
	<body>
		<h1>Ben's GB emulator</h1>

		<button id="run-wasm-test" data-testid="run-wasm-test">Run wasm test</button>
		<p id="wasm-console" data-testid="wasm-console"></p>

		<div id="squaregb-wrapper">
			<button id="load-checkerboard-rom">Load Checkerboard ROM</button>
			<button data-testid="button-run-emulator">Run</button>
			<button data-testid="button-render-screen" id="button-render-screen">Render screen</button>

			<label>
				SCX
				<input data-testid="input-scx" id="scx" type="text">
			</label>
			<label>
				SCY
				<input data-testid="input-scy" id="scy" type="text">
			</label>
			<main id="squaregb-root">
				<canvas id="squaregb-screen" width="160" height="144"></canvas>
				<div id="squaregb-dpad">
					<button id="squaregb-up">UP</button>
					<button id="squaregb-down">DOWN</button>
					<button id="squaregb-left">LEFT</button>
					<button id="squaregb-right">RIGHT</button>
				</div>
				<div id="squaregb-ab">
					<button id="squaregb-a">A</button>
					<button id="squaregb-b">B</button>
				</div>
				<div id="squaregb-selstart">
					<button id="squaregb-select">SELECT</button>
					<button id="squaregb-start">START</button>
				</div>
			</main>
		</div>

		<aside>
			<h2>Tasks</h2>
			<ul>
				<li>Setup
					<ul>
						<li>Path to live: ✅</li>
						<li>Hot-reloading wasm in dev:</li>
						<li>Vite.js</li>
						<li>Frontend visuals:</li>
						<li>Cloudflare workers to pages</li>
					</ul></li>
				<li>Emulation
					<ul>
						<li>CPU</li>
						<li>...</li>
					</ul></li>
			</ul>
		</aside>
		<script type="module" src="index.mjs"></script>
	</body>
</html>
