[package]
name = "squaregb"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arbitrary-int = "2.1.1"
js-sys = "0.3.95"
wasm-bindgen = "0.2.114"

[dependencies.web-sys]
version = "0.3.91"
features = [
"Window",
"Document",
"Element",
"HtmlElement",
"Node"
]



[dev-dependencies]
rstest = "0.26.1"
