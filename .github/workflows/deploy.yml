name: Deploy Worker
on:
  push:
    branches:
      - develop
      - main
      - ci-updates

jobs:
  build:
    uses: ./.github/workflows/build.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Pull down wasm build
        uses: actions/download-artifact@v8
        with: 
          name: 'wasm_dist'
          path: './squaregb/dist'
      - name: NPM Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy 
