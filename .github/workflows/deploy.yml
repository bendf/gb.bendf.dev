name: Deploy Worker
on:
  push:
    branches:
      - develop
      - main
      - ci-updates

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rust:1.95.0
      options: --user 1001
    steps:
      - name: Setup rust
        run: rustup target add wasm32-unknown-unknown && cargo install -f wasm-bindgen-cli --version 0.2.118
      - uses: actions/checkout@v6
      - name: Build crate
        working-directory: ./squaregb
        run: ./build.sh
      - name: Upload Dist folder
        uses: actions/upload-artifact@v7
        with:
          name: 'wasm_dist'
          path: './squaregb/dist'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Pull down wasm build
        uses: actions/download-artifact@v8
        with: 
          name: 'wasm_dist'
          path: './squaregb/dist'
      - name: NPM Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy 
